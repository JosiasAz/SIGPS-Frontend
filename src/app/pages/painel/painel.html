<div class="dashboard-container" [class.collapsed]="isSidebarCollapsed()">
    <!-- ══════════════════════════ SIDEBAR -->
    <aside class="sidebar">
        <div class="sidebar-header">
            <div class="logo-area">
                <img src="/logo.svg" alt="Logo SIGPS" class="logo-img" />
                <span class="logo-text">SIGPS</span>
            </div>
            <button class="collapse-btn" (click)="toggleSidebar()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M15 18l-6-6 6-6" *ngIf="!isSidebarCollapsed()" />
                    <path d="M9 18l6-6-6-6" *ngIf="isSidebarCollapsed()" />
                </svg>
            </button>
        </div>

        <nav class="sidebar-nav">
            <ul>
                @for (item of menuItems(); track item.route) {
                <li>
                    <a [routerLink]="item.route" routerLinkActive="active" [title]="item.label"
                        [routerLinkActiveOptions]="{exact: true}">
                        <span class="nav-icon">
                            <!-- Placeholder icons based on name -->
                            <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor"
                                stroke-width="2">
                                <rect x="3" y="3" width="7" height="7" *ngIf="item.icon === 'grid'"></rect>
                                <rect x="14" y="3" width="7" height="7" *ngIf="item.icon === 'grid'"></rect>
                                <rect x="14" y="14" width="7" height="7" *ngIf="item.icon === 'grid'"></rect>
                                <rect x="3" y="14" width="7" height="7" *ngIf="item.icon === 'grid'"></rect>

                                <path d="M17 21v-2a4 4 0 0 0-4-4H5a4 4 0 0 0-4 4v2" *ngIf="item.icon === 'users'">
                                </path>
                                <circle cx="9" cy="7" r="4" *ngIf="item.icon === 'users'"></circle>
                                <path d="M23 21v-2a4 4 0 0 0-3-3.87" *ngIf="item.icon === 'users'"></path>
                                <path d="M16 3.13a4 4 0 0 1 0 7.75" *ngIf="item.icon === 'users'"></path>

                                <rect x="3" y="4" width="18" height="18" rx="2" ry="2" *ngIf="item.icon === 'calendar'">
                                </rect>
                                <line x1="16" y1="2" x2="16" y2="6" *ngIf="item.icon === 'calendar'"></line>
                                <line x1="8" y1="2" x2="8" y2="6" *ngIf="item.icon === 'calendar'"></line>
                                <line x1="3" y1="10" x2="21" y2="10" *ngIf="item.icon === 'calendar'"></line>

                                <polyline points="22 12 18 12 15 21 9 3 6 12 2 12" *ngIf="item.icon === 'activity'">
                                </polyline>

                                <line x1="8" y1="6" x2="21" y2="6" *ngIf="item.icon === 'list'"></line>
                                <line x1="8" y1="12" x2="21" y2="12" *ngIf="item.icon === 'list'"></line>
                                <line x1="8" y1="18" x2="21" y2="18" *ngIf="item.icon === 'list'"></line>
                                <line x1="3" y1="6" x2="3.01" y2="6" *ngIf="item.icon === 'list'"></line>
                                <line x1="3" y1="12" x2="3.01" y2="12" *ngIf="item.icon === 'list'"></line>
                                <line x1="3" y1="18" x2="3.01" y2="18" *ngIf="item.icon === 'list'"></line>

                                <path d="M21.21 15.89A10 10 0 1 1 8 2.83" *ngIf="item.icon === 'pie-chart'"></path>
                                <path d="M22 12A10 10 0 0 0 12 2v10z" *ngIf="item.icon === 'pie-chart'"></path>

                                <circle cx="12" cy="12" r="3" *ngIf="item.icon === 'settings'"></circle>
                                <path
                                    d="M19.4 15a1.65 1.65 0 0 0 .33 1.82l.06.06a2 2 0 0 1 0 2.83 2 2 0 0 1-2.83 0l-.06-.06a1.65 1.65 0 0 0-1.82-.33 1.65 1.65 0 0 0-1 1.51V21a2 2 0 0 1-2 2 2 2 0 0 1-2-2v-.09A1.65 1.65 0 0 0 9 19.4a1.65 1.65 0 0 0-1.82.33l-.06.06a2 2 0 0 1-2.83 0 2 2 0 0 1 0-2.83l.06-.06a1.65 1.65 0 0 0 .33-1.82 1.65 1.65 0 0 0-1.51-1H3a2 2 0 0 1-2-2 2 2 0 0 1 2-2h.09A1.65 1.65 0 0 0 4.6 9a1.65 1.65 0 0 0-.33-1.82l-.06-.06a2 2 0 0 1 0-2.83 2 2 0 0 1 2.83 0l.06.06a1.65 1.65 0 0 0 1.82.33H9a1.65 1.65 0 0 0 1-1.51V3a2 2 0 0 1 2-2 2 2 0 0 1 2 2v.09a1.65 1.65 0 0 0 1 1.51 1.65 1.65 0 0 0 1.82-.33l.06-.06a2 2 0 0 1 2.83 0 2 2 0 0 1 0 2.83l-.06.06a1.65 1.65 0 0 0-.33 1.82V9a1.65 1.65 0 0 0 1.51 1H21a2 2 0 0 1 2 2 2 2 0 0 1-2 2h-.09a1.65 1.65 0 0 0-1.51 1z"
                                    *ngIf="item.icon === 'settings'"></path>
                            </svg>
                        </span>
                        <span class="nav-label">{{ item.label }}</span>
                    </a>
                </li>
                }
            </ul>
        </nav>

        <div class="sidebar-footer">
            <button class="logout-btn" (click)="onLogout()">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4"></path>
                    <polyline points="16 17 21 12 16 7"></polyline>
                    <line x1="21" y1="12" x2="9" y2="12"></line>
                </svg>
                <span class="nav-label">Sair</span>
            </button>
        </div>
    </aside>

    <!-- ══════════════════════════ MAIN CONTENT -->
    <main class="main-content">
        <!-- Top Navbar -->
        <header class="top-navbar">
            <div class="search-area">
                <div class="search-box">
                    <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <circle cx="11" cy="11" r="8"></circle>
                        <line x1="21" y1="21" x2="16.65" y2="16.65"></line>
                    </svg>
                    <input type="text" placeholder="Buscar pacientes, especialidades..." />
                </div>
            </div>

            <div class="user-actions">
                <button class="icon-btn" title="Notificações">
                    <div class="notification-badge"></div>
                    <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                        <path d="M18 8A6 6 0 0 0 6 8c0 7-3 9-3 9h18s-3-2-3-9"></path>
                        <path d="M13.73 21a2 2 0 0 1-3.46 0"></path>
                    </svg>
                </button>

                <div class="divider"></div>

                <div class="user-profile">
                    <div class="user-info">
                        <span class="name">{{ currentUser()?.name || 'Usuário' }}</span>
                        <span class="role">{{ userRoleLabel() }}</span>
                    </div>
                    <div class="avatar">
                        <img [src]="'https://ui-avatars.com/api/?name=' + (currentUser()?.name || 'User') + '&background=419640&color=fff'"
                            alt="Avatar" />
                    </div>
                </div>
            </div>
        </header>

        <!-- Routable Content -->
        <router-outlet></router-outlet>
    </main>
</div>

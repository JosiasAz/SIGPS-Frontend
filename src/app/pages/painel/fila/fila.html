<section class="page-container">
    <div class="content-header">
        <div>
            <h1>Fila de Espera Inteligente</h1>
            <p>Monitoramento em tempo real com priorização por IA.</p>
        </div>
        <button class="btn-primary-dashboard">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M12 2L2 7l10 5 10-5-10-5zM2 17l10 5 10-5M2 12l10 5 10-5"></path>
            </svg>
            Reordenar Fila
        </button>
    </div>

    <div class="card">
        <div class="table-container">
            <table class="dashboard-table">
                <thead>
                    <tr>
                        <th>Prioridade</th>
                        <th>Paciente</th>
                        <th>Tempo de Espera</th>
                        <th>Especialidade</th>
                        <th>Status</th>
                    </tr>
                </thead>
                <tbody>
                    @for (item of fila; track item.paciente) {
                    <tr>
                        <td>
                            <span class="status-badge" [class.critical]="item.prioridade === 'Alta'"
                                [class.active]="item.prioridade === 'Normal'"
                                [class.waiting]="item.prioridade === 'Baixa'">
                                {{ item.prioridade }}
                            </span>
                        </td>
                        <td><strong>{{ item.paciente }}</strong></td>
                        <td>{{ item.tempoEspera }}</td>
                        <td>{{ item.especialidade }}</td>
                        <td>
                            <span class="status-badge" [class.waiting]="item.status === 'Aguardando'"
                                [class.active]="item.status === 'Em Atendimento'">
                                {{ item.status }}
                            </span>
                        </td>
                    </tr>
                    }
                </tbody>
            </table>
        </div>
    </div>
</section>

<section class="page-container">
    <div class="content-header">
        <div>
            <h1>Relatórios e BI</h1>
            <p>Análise de dados clínica e administrativa.</p>
        </div>
        <button class="btn-primary-dashboard" (click)="exportarPDF()">
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                <polyline points="7 10 12 15 17 10"></polyline>
                <line x1="12" y1="15" x2="12" y2="3"></line>
            </svg>
            Exportar PDF
        </button>
    </div>

    <div class="stats-grid">
        @for (kpi of kpis; track kpi.label) {
        <div class="stat-card">
            <div class="stat-details">
                <span class="stat-label">{{ kpi.label }}</span>
                <h3 class="stat-value">{{ kpi.value }}</h3>
            </div>
        </div>
        }
    </div>

    <div class="card">
        <div class="placeholder-content">
            <p>Seus relatórios detalhados aparecerão aqui conforme o uso do sistema.</p>
        </div>
    </div>
</section>

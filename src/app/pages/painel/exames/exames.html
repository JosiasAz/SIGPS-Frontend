<section class="page-container">
    <div class="content-header" style="flex-direction: column; align-items: flex-start;">
        <div>
            <a routerLink="/painel/portal-paciente" class="btn-back">
                <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                    <line x1="19" y1="12" x2="5" y2="12"></line>
                    <polyline points="12 19 5 12 12 5"></polyline>
                </svg>
                Voltar
            </a>
            <h1>Exames e Laudos</h1>
            <p>Seus resultados de exames, pedidos médicos e histórico clínico.</p>
        </div>
    </div>

    <div class="card">
        <div class="table-container">
            <table class="dashboard-table">
                <thead>
                    <tr>
                        <th>Nome do Exame</th>
                        <th>Data</th>
                        <th>Médico Solicitante</th>
                        <th>Status</th>
                        <th>Ações</th>
                    </tr>
                </thead>
                <tbody>
                    @for (exame of exames; track exame.title) {
                    <tr>
                        <td>
                            <div class="exame-info">
                                <div class="icon-file">
                                    <svg width="20" height="20" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                        <path d="M14 2H6a2 2 0 0 0-2 2v16a2 2 0 0 0 2 2h12a2 2 0 0 0 2-2V8z"></path>
                                        <polyline points="14 2 14 8 20 8"></polyline>
                                    </svg>
                                </div>
                                <div class="details">
                                    <strong>{{ exame.title }}</strong>
                                    <span>{{ exame.type }}</span>
                                </div>
                            </div>
                        </td>
                        <td>{{ exame.date }}</td>
                        <td>{{ exame.doctor }}</td>
                        <td>
                            <span class="status-badge" [class.active]="exame.status === 'Disponível'">{{ exame.status }}</span>
                        </td>
                        <td>
                            <button class="btn-outline-sm">Visualizar</button>
                            <button class="icon-btn-sm" title="Baixar PDF">
                                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2">
                                    <path d="M21 15v4a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2v-4"></path>
                                    <polyline points="7 10 12 15 17 10"></polyline>
                                    <line x1="12" y1="15" x2="12" y2="3"></line>
                                </svg>
                            </button>
                        </td>
                    </tr>
                    }
                </tbody>
            </table>
        </div>
    </div>
</section>
